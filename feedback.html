<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação</title>
    <link rel="stylesheet" href="src/css/feedback.css">
</head>
<body>

    <div class="card-satisfacao">
        <div class="header">
            <h2>Sua opinião importa!</h2>
            <p>Conte-nos como foi sua experiência com a nossa apresentação hoje.</p>
        </div>

            <button class="btn-nota" data-nota="2">
                <span class="emoji">🙁</span>
                <span class="legenda">Ruim</span>
            </button>
            <button class="btn-nota" data-nota="3">
                <span class="emoji">😐</span>
                <span class="legenda">Regular</span>
            </button>
            <button class="btn-nota" data-nota="4">
                <span class="emoji">🙂</span>
                <span class="legenda">Bom</span>
            </button>
            <button class="btn-nota" data-nota="5">
                <span class="emoji">🤩</span>
                <span class="legenda">Excelente</span>
            </button>
        </div>

        <div class="comentario-container">
            <label for="comentario">Quer deixar mais detalhes? (Opcional)</label>
            <textarea id="comentario" placeholder="Escreva aqui o que podemos melhorar ou o que você mais gostou..."></textarea>
        </div>

        <button class="btn-enviar">Enviar Feedback</button>
    </div>

</body>
